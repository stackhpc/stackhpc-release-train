---
- name: Proceed with adding workflows
  when: target_branch in remote_branches
  vars:
    target_branch: "{{ workflow_manifest.prefix | default('') }}{{ workflow_manifest.branch }}"
    work_branch: "{{ workflow_manifest.prefix | default('') }}{{ workflow_manifest.branch }}-workflows"
  block:
    - name: Fetch target branch # noqa command-instead-of-module
      ansible.builtin.command:
        cmd: git fetch --depth 1 origin +refs/heads/{{ target_branch }}:refs/remotes/origin/{{ target_branch }}
        chdir: "{{ staging_path }}/{{ repository_manifest.name }}"
      changed_when: false

    - name: Create working branch locally # noqa command-instead-of-module
      ansible.builtin.command:
        cmd: git checkout -f -B {{ work_branch }} origin/{{ target_branch }}
        chdir: "{{ staging_path }}/{{ repository_manifest.name }}"
      changed_when: false

    - name: Create .github/workflows directory
      ansible.builtin.file:
        path: "{{ staging_path }}/{{ repository_manifest.name }}/.github/workflows"
        state: directory
        mode: "0755"

    - name: Copy workflow into repository
      ansible.builtin.template:
        src: "templates/{{ workflow }}.jinja"
        dest: "{{ staging_path }}/{{ repository_manifest.name }}/.github/workflows/{{ workflow }}.yml"
        mode: "0644"
      with_items: "{{ workflow_manifest.workflows }}"
      loop_control:
        loop_var: workflow
      register: workflow_copy

    - name: Remove TravisCI file
      ansible.builtin.file:
        path: "{{ staging_path }}/{{ repository_manifest.name }}/.travis.yml"
        state: absent
      register: travis_rm

    - name: Remove publish workflow
      ansible.builtin.file:
        path: "{{ staging_path }}/{{ repository_manifest.name }}/.github/workflows/{{ unwanted_workflow }}.yml"
        state: absent
      register: publish_rm
      with_items:
        - publish_role
        - publish_collection
      loop_control:
        loop_var: unwanted_workflow

    - name: Propose changes
      when: workflow_copy.changed | bool or travis_rm.changed or publish_rm.changed | bool
      block:
        - name: Commit changes # noqa command-instead-of-module
          ansible.builtin.shell:
            cmd: |
              git add . --force && git commit -m \
              'feat: automatic update of workflows {{ target_branch }}'
            chdir: "{{ staging_path }}/{{ repository_manifest.name }}"
          changed_when: true

        - name: Check existing working branch
          when: work_branch in remote_branches
          block:
            - name: Fetch remote working branch # noqa command-instead-of-module
              ansible.builtin.command:
                cmd: git fetch --depth 1 origin +refs/heads/{{ work_branch }}:refs/remotes/origin/{{ work_branch }}
                chdir: "{{ staging_path }}/{{ repository_manifest.name }}"
              changed_when: false

            - name: Compare with remote working branch # noqa command-instead-of-module
              ansible.builtin.command:
                cmd: git diff --quiet origin/{{ work_branch }} HEAD
                chdir: "{{ staging_path }}/{{ repository_manifest.name }}"
              changed_when: false
              failed_when: false
              register: remote_diff

            - name: Check for open pull request # noqa command-instead-of-shell
              ansible.builtin.shell:
                cmd: gh pr list --head {{ work_branch }} --base {{ target_branch }} --state open --json number --jq length
                chdir: "{{ staging_path }}/{{ repository_manifest.name }}"
              changed_when: false
              register: open_pr

        - name: Determine required actions
          ansible.builtin.set_fact:
            push_required: "{{ work_branch not in remote_branches or remote_diff.rc != 0 }}"
            pr_required: "{{ work_branch not in remote_branches or open_pr.stdout | int == 0 }}"

        # The working branch is owned by this automation, so overwrite it in
        # place. This updates any open pull request rather than closing it, and
        # never leaves a window where the branch has been deleted but not
        # re-pushed. If a later step fails, the next run will resume from here.
        - name: Push branch to remote # noqa command-instead-of-module command-instead-of-shell
          ansible.builtin.shell:
            cmd: "git push --force -u origin {{ work_branch }}"
            chdir: "{{ staging_path }}/{{ repository_manifest.name }}"
          changed_when: true
          when: push_required | bool

        - name: Open pull request
          when: pr_required | bool
          block:
            - name: Ensure required labels exist on remote
              ansible.builtin.include_tasks: "tasks/add_label.yml"
              vars:
                required_labels: [stackhpc-ci, workflows]

            - name: Open pull request # noqa command-instead-of-shell
              ansible.builtin.shell:
                cmd: 'gh pr create --fill --head {{ work_branch }} --base {{ target_branch }} --label stackhpc-ci --label workflows'
                chdir: "{{ staging_path }}/{{ repository_manifest.name }}"
              changed_when: true

            - name: Pause playbook to prevent exceeding API rate limit
              ansible.builtin.pause:
                seconds: 10
  rescue:
    - name: Record branch failure
      ansible.builtin.include_tasks: tasks/record_failure.yml
      vars:
        failure_scope: "{{ repository_manifest.name }}@{{ target_branch }} (workflows)"
        failure_task: "{{ ansible_failed_task.name | default('unknown') }}"

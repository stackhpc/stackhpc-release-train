---
- name: List existing labels # noqa command-instead-of-shell
  ansible.builtin.shell:
    cmd: gh label list -L 500 --json name --jq '.[].name'
    chdir: "{{ staging_path }}/{{ repository_manifest.name }}"
  changed_when: false
  register: existing_labels

- name: Add missing labels to repository # noqa command-instead-of-shell
  ansible.builtin.shell:
    cmd: gh label create {{ label_name | quote }} --force
    chdir: "{{ staging_path }}/{{ repository_manifest.name }}"
  changed_when: true
  loop: "{{ required_labels | difference(existing_labels.stdout_lines) }}"
  loop_control:
    loop_var: label_name
